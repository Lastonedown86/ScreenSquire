name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            agent/requirements.txt
            agent/requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r agent/requirements.txt -r agent/requirements-dev.txt
      - name: Test without altering runtime data
        shell: bash
        run: |
          snapshot() {
            if [[ -f agent/data/dashboard.json ]]; then
              sha256sum agent/data/dashboard.json
              stat -c '%Y' agent/data/dashboard.json
            else
              printf 'MISSING\n'
            fi
          }
          before="$(snapshot)"
          python -m pytest agent -q
          after="$(snapshot)"
          if [[ "$before" != "$after" ]]; then
            echo "Runtime dashboard data changed during tests"
            exit 1
          fi

  dotnet:
    name: .NET tests and Release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore PiSignage.slnx
      - name: Test
        run: dotnet test PiSignage.slnx -c Release --no-restore
      - name: Build
        run: dotnet build PiSignage.slnx -c Release --no-restore

  shell:
    name: Shell and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate Raspberry Pi scripts
        shell: bash
        run: |
          for script in pi-setup/*.sh; do
            bash -n "$script"
          done
      # A shipped agent change without a version bump installs fine and then does
      # nothing: the app compares AGENT_VERSION to decide whether a Pi is out of
      # date, so an unbumped fix is invisible to every Pi already on that version.
      - name: Require an AGENT_VERSION bump when shipped agent files change
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="origin/${{ github.base_ref }}"
          # Only files that actually reach a Pi. Tests are never embedded, docs
          # and requirements are not part of the pushed bundle (they need a
          # builder deployment), but static/** ships and must force a bump.
          relevant=$(git diff --name-only "$base...HEAD" -- agent/ | grep -Ev \
            '^agent/(tests/|test_[^/]*\.py$|.*\.md$|requirements(-dev)?\.txt$)' || true)
          if [ -z "$relevant" ]; then
            echo "No shipped agent files changed."
            exit 0
          fi
          echo "Shipped agent files changed:"
          printf '  %s\n' $relevant
          # Not anchored to end of line: AGENT_VERSION carries a trailing comment,
          # and a Windows checkout would leave a CR there too.
          extract() { sed -n 's/^AGENT_VERSION = "\([^"]*\)".*/\1/p'; }
          old=$(git show "$base:agent/main.py" | extract)
          new=$(extract < agent/main.py)
          if [ -z "$new" ]; then
            echo "Could not read AGENT_VERSION from agent/main.py"
            exit 1
          fi
          if [ "$old" = "$new" ]; then
            echo "AGENT_VERSION is still $new."
            echo "Bump it in agent/main.py or these changes will never reach a Pi."
            exit 1
          fi
          echo "AGENT_VERSION $old -> $new"

      - name: Check repository whitespace
        run: git log --check --oneline --all
