<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signage</title>
<style>
  /* A signage screen has one job: show the content, edge to edge, on pure
     black. Everything else stays invisible unless something is wrong. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  .layer {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .5s ease;
  }
  .layer.visible { opacity: 1; }
  .layer img, .layer video { width: 100%; height: 100%; object-fit: contain; }
  .layer iframe { width: 100%; height: 100%; border: 0; }

  /* idle card — shown only when there is no playlist yet */
  #idle { color: #3a3a3a; font: 500 3.5vmin/1.5 system-ui, sans-serif;
          text-align: center; letter-spacing: .04em; }
  /* anti burn-in: the idle card drifts around the screen forever, so no
     pixel stays lit in one place (background is pure black = safe) */
  #idleInner { display: flex; flex-direction: column; align-items: center;
               animation: drift 240s ease-in-out infinite; }
  @keyframes drift {
    0%   { transform: translate(0, 0); }
    20%  { transform: translate(24vw, 18vh); }
    40%  { transform: translate(-22vw, 24vh); }
    60%  { transform: translate(-24vw, -18vh); }
    80%  { transform: translate(22vw, -24vh); }
    100% { transform: translate(0, 0); }
  }
  #idle .dot { width: 1.2vmin; height: 1.2vmin; border-radius: 50%; background: #2e7d32;
               margin-bottom: 2vmin; animation: pulse 2.4s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* tiny corner badge if the agent connection drops — visible from the couch,
     ignorable from across the room */
  #offline { position: fixed; right: 16px; bottom: 16px; padding: 6px 12px;
             background: #b71c1c; color: #fff; font: 600 12px system-ui;
             border-radius: 4px; display: none; }

  /* a running round timer is always visible, over whatever is playing */
  #timerOverlay { position: fixed; top: 2vmin; right: 2vmin; display: none;
                  background: rgba(0,0,0,.72); color: #fff; border-radius: 1.2vmin;
                  padding: 1vmin 2vmin; text-align: center;
                  font: 700 5vmin/1.15 system-ui, sans-serif;
                  font-variant-numeric: tabular-nums; z-index: 10; }
  #timerOverlay .lbl { font-size: 1.8vmin; font-weight: 600; color: #b9c0d0; }
  #timerOverlay.over { background: rgba(160,20,20,.85); }
</style>
</head>
<body>
  <!-- YouTube IFrame Player API — if it never loads (offline boot, blocked),
       ytReady stays false and youtube items fall back to a muted embed -->
  <script src="https://www.youtube.com/iframe_api" async></script>
  <div class="layer" id="idle"><div id="idleInner"><div class="dot"></div><div id="idleText">Ready — waiting for content</div></div></div>
  <div class="layer" id="a"></div>
  <div class="layer" id="b"></div>
  <div id="offline">Reconnecting…</div>
  <div id="timerOverlay"><div class="lbl" id="timerLbl"></div><div id="timerVal">--:--</div></div>

<script>
(() => {
  const layers = [document.getElementById('a'), document.getElementById('b')];
  const idle = document.getElementById('idle');
  const offline = document.getElementById('offline');
  let front = 0;            // which layer is currently visible
  let currentId = null;     // avoid reloading the same item on reconnect
  let ws = null;

  // ---- YouTube IFrame Player API state ----
  let ytReady = false;
  window.onYouTubeIframeAPIReady = () => { ytReady = true; };
  let yt = null;            // {player, layer, videoId} while a player exists
  let ytVolume = 100;       // last volume asked for; applied to new players

  function sendYtState(state, videoId) {
    if (ws && ws.readyState === 1)
      ws.send(JSON.stringify({ type: 'yt-state', state: state, videoId: videoId }));
  }

  // players keep playing audio even after their element is detached —
  // destroy explicitly whenever the layer holding one gets cleared
  function destroyYtIn(layer) {
    if (yt && yt.layer === layer) {
      try { yt.player.destroy(); } catch (e) {}
      yt = null;
    }
  }

  function show(msg) {
    if (msg.type === 'idle') {
      if (msg.name) document.getElementById('idleText').textContent =
        msg.name + ' — ready, waiting for content';
      layers.forEach(l => { destroyYtIn(l); l.classList.remove('visible'); l.innerHTML = ''; });
      idle.classList.add('visible');
      currentId = null;
      return;
    }
    if (msg.id && msg.id === currentId) return;   // already showing it
    currentId = msg.id || null;
    idle.classList.remove('visible');

    const back = layers[1 - front];
    destroyYtIn(back);
    back.innerHTML = '';
    let el;
    if (msg.type === 'youtube' && ytReady && window.YT && YT.Player) {
      if (msg.volume != null) ytVolume = msg.volume;
      const div = document.createElement('div');
      back.appendChild(div);   // the API replaces this div with its own iframe
      yt = { layer: back, videoId: msg.videoId, player: new YT.Player(div, {
        videoId: msg.videoId,
        playerVars: { autoplay: 1, controls: 0, rel: 0 },
        events: {
          onReady: (e) => {
            e.target.setVolume(ytVolume);
            e.target.unMute();           // embeds start muted in some states
            e.target.playVideo();
            swap(back);
          },
          onStateChange: (e) => {
            const s = { [YT.PlayerState.PLAYING]: 'playing',
                        [YT.PlayerState.PAUSED]: 'paused',
                        [YT.PlayerState.ENDED]: 'ended' }[e.data];
            if (s) sendYtState(s, msg.videoId);
          },
          onError: () => { sendYtState('error', msg.videoId); swap(back); },
        },
      })};
      setTimeout(() => swap(back), 4000);  // same safety net as the url path
      return;
    }
    if (msg.type === 'image') {
      el = new Image();
      el.src = msg.src;
      el.onload = () => swap(back);
      el.onerror = () => swap(back);              // still swap; black beats stuck
    } else if (msg.type === 'video') {
      el = document.createElement('video');
      el.src = msg.src;
      el.muted = true;                            // required for autoplay
      el.autoplay = true; el.loop = true; el.playsInline = true;
      el.oncanplay = () => swap(back);
      el.onerror = () => swap(back);
    } else if (msg.type === 'url' || msg.type === 'youtube') {
      // 'youtube' here means the Player API isn't available — muted embed fallback
      el = document.createElement('iframe');
      el.src = msg.type === 'youtube'
        ? 'https://www.youtube.com/embed/' + msg.videoId
          + '?autoplay=1&mute=1&controls=0&loop=1&playlist=' + msg.videoId
        : msg.src;
      el.sandbox = 'allow-scripts allow-same-origin allow-forms allow-presentation';
      // let embeds autoplay video + play DRM audio (YouTube, Spotify, etc.)
      el.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
      // iframes fire load even on some failures; swap after a short grace period
      el.onload = () => swap(back);
      setTimeout(() => swap(back), 4000);
    } else { return; }
    back.appendChild(el);
  }

  function swap(back) {
    if (back.classList.contains('visible')) return;
    const old = layers[front];
    back.classList.add('visible');
    old.classList.remove('visible');
    front = 1 - front;
    // free the old media after the fade so videos stop downloading/decoding
    // (and kill any YouTube player left there, or its audio keeps going)
    setTimeout(() => {
      if (!old.classList.contains('visible')) { destroyYtIn(old); old.innerHTML = ''; }
    }, 600);
  }

  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = () => { offline.style.display = 'none'; };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.type === 'yt-control') {          // transport command, not content
        if (m.action === 'volume' && m.value != null) ytVolume = m.value;
        const p = yt && yt.player;
        if (!p) return;
        try {
          if (m.action === 'pause') p.pauseVideo();
          else if (m.action === 'play') { p.unMute(); p.playVideo(); }
          else if (m.action === 'volume') p.setVolume(ytVolume);
          else if (m.action === 'seek') p.seekTo(p.getCurrentTime() + m.value, true);
        } catch (err) {}
        return;
      }
      try { show(m); } catch {}
    };
    ws.onclose = () => {
      offline.style.display = 'block';
      setTimeout(connect, 2000);                  // retry forever
    };
    ws.onerror = () => ws.close();
  }
  connect();

  // keepalive ping so half-dead connections get noticed
  setInterval(() => { if (ws && ws.readyState === 1) ws.send('ping'); }, 20000);

  // ---- always-on round timer overlay ----
  // Whatever the TV is playing, a running timer stays visible in the corner.
  const tOverlay = document.getElementById('timerOverlay');
  const tVal = document.getElementById('timerVal');
  const tLbl = document.getElementById('timerLbl');
  let tState = null, tEndsAt = null, tPausedRem = null, tLabel = '';

  async function pollTimer() {
    try {
      const r = await fetch('/api/dashboard', { cache: 'no-store' });
      const t = ((await r.json()) || {}).timer || {};
      tState = t.state || 'stopped';
      tEndsAt = t.state === 'running' ? t.endsAt : null;
      tPausedRem = t.state === 'paused' ? t.remaining : null;
      tLabel = t.label || '';
    } catch (e) { /* keep last known state on a blip */ }
  }

  function fmtT(s) { s = Math.max(0, Math.round(s));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

  function tickTimer() {
    let rem = null;
    if (tState === 'running' && tEndsAt != null) rem = (tEndsAt - Date.now()) / 1000;
    else if (tState === 'paused') rem = tPausedRem;
    if (rem == null) { tOverlay.style.display = 'none'; return; }
    tOverlay.style.display = 'block';
    tOverlay.classList.toggle('over', rem <= 0);
    tVal.textContent = rem <= 0 ? 'TIME' : fmtT(rem);
    tLbl.textContent = tState === 'paused' ? (tLabel + ' — paused').trim() : tLabel;
  }
  pollTimer(); setInterval(pollTimer, 5000);
  setInterval(tickTimer, 250);

  // if the page has been up for a very long time, a nightly reload keeps
  // Chromium's memory in check (03:30 local). Only reload while connected —
  // reloading with the agent down would land on an error page with no JS to
  // ever recover from it.
  setInterval(() => {
    const d = new Date();
    if (d.getHours() === 3 && d.getMinutes() === 30
        && ws && ws.readyState === 1) location.reload();
  }, 60000);
})();
</script>
</body>
</html>
